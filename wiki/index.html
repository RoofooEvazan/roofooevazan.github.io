<head>

<meta name="description" content="The Project Diablo 2 wiki, rebuilt for fast reading and searching on any device. Synced from wiki.projectdiablo2.com every day.">

<meta property="og:description" content="The Project Diablo 2 wiki, rebuilt for fast reading and searching on any device.">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Cinzel:wght@500;700&family=Silkscreen:wght@400;700&display=swap">

<body class="tri">
<script src="../assets/site-nav.js"></script>

<div class="bar">
  <div class="bar-in">
    <button class="icon-btn menu-btn" type="button" aria-label="Browse pages" aria-controls="side" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h10M4 18h16"/></svg>
    </button>
    <a class="wordmark" href="#/"><span class="orb" aria-hidden="true"></span><span>PD2 Wiki</span></a>
    <div class="search" role="search">
      <div class="search-field">
      <svg class="search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search items, skills, runewords, pages…" autocomplete="off" spellcheck="false"
        role="combobox" aria-expanded="false" aria-controls="q-results" aria-autocomplete="list" aria-label="Search the wiki">
      <kbd class="search-kbd" aria-hidden="true">/</kbd>
      </div>
      <div class="results" id="q-results" role="listbox" hidden></div>
    </div>
  </div>
</div>

<div class="layout">
  <aside class="side" id="side" aria-label="Wiki pages">
    <div class="side-head">
      <input id="side-filter" type="search" placeholder="Filter pages" aria-label="Filter the page list" autocomplete="off">
      <button class="icon-btn side-close" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <nav class="side-nav" id="side-nav"></nav>
  </aside>
  <div class="scrim" hidden></div>

  <main class="main" id="main" tabindex="-1">
    <div class="loading">Loading the wiki…</div>
  </main>

  <aside class="toc-rail" id="toc-rail" aria-label="On this page"></aside>
</div>

<div class="lightbox" hidden><img alt=""><button class="icon-btn" type="button" aria-label="Close image">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
<button class="to-top" type="button" aria-label="Back to top" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14 6-6 6 6"/></svg></button>

<script src="wiki.js"></script>
<script src="items.js"></script>
<script src="skills.js"></script>
<script src="maps.js"></script>
<script src="patches.js"></script>
<script src="cube.js"></script>
<script src="world.js"></script>
<script src="mech.js"></script>
<script src="affixes.js"></script>
<script src="gear.js"></script>
<script src="guide.js"></script>
<script src="filters.js"></script>
<script src="classes.js"></script>
<script src="extras.js"></script>
<script src="overview.js"></script>
<script src="merc.js"></script>
</body>
</html>

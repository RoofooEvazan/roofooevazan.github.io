# Copies the PD2 wiki (and the Act 2 merc weapon sheet) into wiki/data/ and commits whatever
# changed so GitHub Pages republishes /wiki/.
# The daily run moved to a Windows scheduled task on Roofoo's PC (tools/wiki-sync/local-sync.ps1):
# since 2026-09-27 wiki.projectdiablo2.com answers GitHub's runners with HTTP 403. This stays for a
# manual try from the Actions tab ("Run workflow"; tick "full" to re-fetch every page).
name: Wiki sync

on:
  workflow_dispatch:
    inputs:
      full:
        description: Re-fetch every page, not just the ones that changed
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install the sync's HTML parser
        run: npm ci --prefix tools/wiki-sync

      - name: Sync from wiki.projectdiablo2.com
        id: sync
        run: node tools/wiki-sync/sync.mjs ${{ inputs.full && '--full' || '' }}

      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wiki/data
          if git diff --cached --quiet; then
            # GitHub turns off scheduled workflows after 60 days without commits,
            # so leave a heartbeat if the wiki has been quiet for a while.
            last=$(git log -1 --format=%ct)
            if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
              date -u +%FT%TZ > wiki/data/last-check.txt
              git add wiki/data/last-check.txt
            fi
          fi
          if git diff --cached --quiet; then
            echo "Nothing changed on the wiki."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Wiki sync: ${{ steps.sync.outputs.summary || 'refresh' }}"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Ask Pages to rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages will pick up the push on its own."
